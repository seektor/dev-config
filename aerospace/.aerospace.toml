start-at-login = false
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.right      = 0
outer.top        = 0
outer.bottom     = 0

# Workspace → monitor assignment (1-indexed, left-to-right)
# Adjust if your monitor order differs.
[workspace-to-monitor-force-assignment]
1 = 1  # main monitor
2 = 1  # main monitor
3 = 2  # Brave      → secondary monitor
4 = 2  # Ghostty    → secondary monitor
5 = 2  # VSCode     → secondary monitor
6 = 2  # secondary monitor

[mode.main.binding]

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Switch workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-b = 'workspace 3'  # brave
alt-t = 'workspace 4'  # terminal
alt-v = 'workspace 5'  # vscode
alt-6 = 'workspace 6'

# Move window to workspace (and follow it)
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-b = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-t = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-v = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']

# Move window to other monitor (keeps workspace)
alt-shift-leftSquareBracket  = 'move-node-to-monitor prev --wrap-around'
alt-shift-rightSquareBracket = 'move-node-to-monitor next --wrap-around'

# Toggle between last two workspaces
alt-tab = 'workspace-back-and-forth'

# Move whole workspace to other monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion'

# Fullscreen (AeroSpace-managed, not macOS native)
alt-f = 'fullscreen'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Reload config
alt-shift-semicolon = 'reload-config'

# ── App → workspace assignments ──────────────────────────────────────────────

[[on-window-detected]]
if.app-name-regex-substring = 'Discord'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-name-regex-substring = 'Brave Browser'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-name-regex-substring = 'Code'
run = 'move-node-to-workspace 5'
